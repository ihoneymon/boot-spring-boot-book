extends: default
font:
  catalog:
    NotoSansCJKkr:
      normal: NotoSansCJKkr-Regular.otf
      bold: NotoSansCJKkr-Bold.otf
      italic: NotoSansCJKkr-Regular.otf
      bold_italic: NotoSansCJKkr-Bold.otf
    M+ 1mn:
      normal: mplus1mn-regular-subset.ttf
      bold: mplus1mn-bold-subset.ttf
      italic: mplus1mn-italic-subset.ttf
      bold_italic: mplus1mn-bold_italic-subset.ttf
  fallbacks:
    - NotoSansCJKkr
base:
  font_family: NotoSansCJKkr
  font_size: 10.5
  line_height: 1.6
code:
  font_family: M+ 1mn
  font_size: 9
